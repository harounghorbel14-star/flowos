name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://flowos:flowos@localhost:5432/flowos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # PostgreSQL 16 ships with the Ubuntu runner image; starting it avoids pulling a
      # container image (Docker Hub rate-limits anonymous pulls on shared runners).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -h localhost -q && break; sleep 1; done
          # createdb: the migration tests create scratch databases named flowos_test_*.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role flowos login createdb password 'flowos'"
          sudo -u postgres createdb -O flowos flowos_test
          pg_isready -h localhost
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://flowos:flowos@localhost:5432/flowos
      PORT: "3000"
      APP_ORIGIN: http://localhost:3000
      STORAGE_DIR: /tmp/flowos-storage
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # PostgreSQL 16 ships with the Ubuntu runner image; starting it avoids pulling a
      # container image (Docker Hub rate-limits anonymous pulls on shared runners).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -h localhost -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role flowos login password 'flowos'"
          sudo -u postgres createdb -O flowos flowos
          pg_isready -h localhost
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run db:migrate
      # NODE_ENV only on the server step: during `npm ci` it would skip devDependencies.
      - name: Start server
        env:
          NODE_ENV: production
        run: |
          # A throwaway key generated per run, so the integrations flow is exercised.
          INTEGRATIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)" node dist/server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat server.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/.artifacts

  image:
    name: Container image (build, migrate, start)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -h localhost -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role flowos login password 'flowos'"
          sudo -u postgres createdb -O flowos flowos
      # Base image from the ECR Public mirror of the official image (Docker Hub rate-limits anonymous pulls).
      - name: Build image
        run: docker build --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-bookworm-slim -t flowos:ci .
      - name: Migrate, start and check readiness
        env:
          DATABASE_URL: postgres://flowos:flowos@127.0.0.1:5432/flowos
        run: |
          docker run --rm --network host -e DATABASE_URL flowos:ci node dist/server/migrate.js
          docker run -d --name flowos --network host -e DATABASE_URL -e PORT=3000 -e APP_ORIGIN=http://localhost:3000 flowos:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/ready && break; sleep 1; done
          curl -sf http://localhost:3000/api/ready
          curl -sf -o /dev/null http://localhost:3000/
          docker stop -t 15 flowos
          docker logs flowos 2>&1 | tee container.log
          grep -q "Shutdown complete." container.log
